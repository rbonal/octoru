name: build-verify
on:
  pull_request:
    branches: [ auto/build ]
  push:
    branches: [ 'seo/**', 'feat/**', 'fix/**', 'ci/**' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/verify_build.sh
