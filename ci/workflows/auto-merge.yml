name: auto-merge-on-green

# DORMANT BY DEFAULT. Once enabled, a labeled PR into auto/build is set to GitHub
# native auto-merge, which merges ONLY after required checks (build-verify) pass —
# then Cloudflare deploys. Two explicit opt-ins keep publishing deliberate:
#   1. Repo variable  ENABLE_AUTO_MERGE = true
#   2. build-verify must be REQUIRED via branch protection on auto/build
# Per-PR intent is the 'auto-deploy' label. Delete the variable to disarm instantly.

on:
  pull_request:
    types: [ opened, reopened, synchronize, labeled ]
    branches: [ auto/build ]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: vars.ENABLE_AUTO_MERGE == 'true' && contains(github.event.pull_request.labels.*.name, 'auto-deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Enable native auto-merge (waits for required checks)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}" -R "${{ github.repository }}"
